name: Refresh profile activity graph

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_activity_graph.py
      - .github/workflows/profile-activity.yml

permissions:
  contents: write

concurrency:
  group: profile-activity-graph
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate graph from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_activity_graph.py --user RamiNoodle733
      - name: Save a changed graph
        run: |
          if ! git diff --quiet -- assets/activity-graph.svg; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/activity-graph.svg
            git commit -m 'chore: refresh profile activity graph'
            git push origin HEAD:main
          fi
